name: Apply assignment stopwatch patch

on:
  push:
    branches:
      - feat/assignment-stopwatch

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/assignment-stopwatch
      - name: Patch assignment timer behavior
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/app.js')
          source = path.read_text(encoding='utf-8')

          old_candidate = "  state.timer = beginTimer(candidate.subjectId); state.timer.type = candidate.type; state.timer.segments[0].type = candidate.type; state.timer.candidateId = candidate.id; await persist('タイマーを始めました'); renderAll();"
          new_candidate = "  state.timer = candidate.type === 'assignment' ? beginStopwatch(candidate.subjectId) : beginTimer(candidate.subjectId); state.timer.type = candidate.type; state.timer.segments[0].type = candidate.type; state.timer.candidateId = candidate.id; await persist('タイマーを始めました'); renderAll();"

          old_manual = "    const subjectId = $('#start-subject').value;\n    state.timer = beginTimer(subjectId);\n    state.timer.type = $('#start-type').value;"
          new_manual = "    const subjectId = $('#start-subject').value;\n    const type = $('#start-type').value;\n    state.timer = type === 'assignment' ? beginStopwatch(subjectId) : beginTimer(subjectId);\n    state.timer.type = type;"

          for label, old in [('candidate', old_candidate), ('manual', old_manual)]:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label} target count was {count}, expected 1')

          source = source.replace(old_candidate, new_candidate).replace(old_manual, new_manual)
          path.write_text(source, encoding='utf-8')
          PY
      - name: Verify patch
        shell: bash
        run: |
          node --check src/app.js
          python - <<'PY'
          from pathlib import Path
          source = Path('src/app.js').read_text(encoding='utf-8')
          required = [
              "candidate.type === 'assignment' ? beginStopwatch(candidate.subjectId) : beginTimer(candidate.subjectId)",
              "const type = $('#start-type').value;",
              "type === 'assignment' ? beginStopwatch(subjectId) : beginTimer(subjectId)",
              "const minimum = stopwatch ? 60000 : 1800000;",
          ]
          missing = [item for item in required if item not in source]
          if missing:
              raise SystemExit('missing expected code: ' + repr(missing))
          PY
          git diff --check
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- src/app.js; then
            echo 'No patch needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/app.js
          git commit -m 'Use stopwatch for assignment tasks'
          git push origin HEAD:feat/assignment-stopwatch
